# Seeed LR2021 EVK — node B, EU 2.4 GHz, stock 1 Mbaud USB path.
#
# Copy this file to a private location, replace the nsec and peer npub, and
# never commit real identities. This node uses LR2021 link id 2 and points back
# at node A's link id 1.
node:
  identity:
    nsec: "REPLACE_WITH_NSEC"

tun:
  enabled: true
  name: fips0
  mtu: 1280

dns:
  enabled: false

transports:
  lr2021:
    # Replace with the station B /dev/serial/by-id/... path.
    port: /dev/ttyACM1
    baud: 1000000
    band: eu2400
    local_id: 2
    mtu: 512
    radio_payload: 255
    auto_connect: true
    # Half-duplex link tuning validated on the EVK (2026-11-22).
    ack_timeout_ms: 200
    ack_delay_ms: 10
    tx_pacing_ms: 2
    # Exactly one end is the master; the other transmits only in response.
    master: false

peers:
  - npub: "REPLACE_WITH_PEER_NPUB"
    alias: "seeed-node-a"
    addresses:
      - transport: lr2021
        addr: "1"
