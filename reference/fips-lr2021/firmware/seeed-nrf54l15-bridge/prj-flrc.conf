# FLRC radio bridge: adds the USP/RAC LR2021 packet path on top of prj.conf.
# The host framing UART remains UART20 at CONFIG_SEEED_BRIDGE_UART_BAUD.

CONFIG_SEEED_BRIDGE_FLRC=y

# Semtech USP modules and the LR20xx driver through the Wio-LR2021 shield.
CONFIG_LORA_BASICS_MODEM_DRIVERS=y
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_GLOBAL_THREAD=y
CONFIG_USP=y

# The UART main loop runs the RAC engine directly, matching the stock FLRC
# PER sample. A separate USP thread is deliberately not used: both threads
# would be cooperative and the framed UART loop can starve radio service.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=-2

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_PM_DEVICE=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_DCACHE=n
CONFIG_FLASH=y
