name: Host Unit Tests

# Runs all host-side C/C++ unit test suites on every push and PR.
# Test suites:
#   - nostr_store    (7 tests)    — tracker/firmware/components/nostr_store
#   - relay-pipeline (12 tests)   — tracker/firmware/main/test/test_relay_pipeline.c
#   - payment-proto  (133 tests)  — tracker/firmware/main/test/test_tollgate_payment_proto.c
#   - tollgate       (~350 tests) — mesh-stack/tollgate/tests/unit (Makefile, 13 binaries)
#   - ehash-relay    (65 tests)   — mesh-stack/ehash-relay/test
#   - stratorelay    (11 tests)   — tracker/firmware/components/stratorelay/test
# Any failing suite fails the entire job.

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make libmbedtls-dev libcjson-dev

      # ── Suite 1: nostr_store (7 tests) ──────────────────────────
      - name: Build & run nostr_store tests
        run: |
          cd tracker/firmware/components/nostr_store
          cc -Wall -Wextra -O2 -I include \
            -o /tmp/test_nostr_store \
            nostr_store.c test/test_nostr_store.c
          /tmp/test_nostr_store

      # ── Suite 2: relay-pipeline (12 tests) ───────────────────────
      - name: Build & run relay pipeline tests
        run: |
          cd tracker/firmware
          gcc -Wall -O2 -I main -I components/nostr_store/include \
            -o /tmp/test_relay_pipeline \
            main/test/test_relay_pipeline.c \
            main/tollgate_payment_proto.c \
            components/nostr_store/nostr_store.c
          /tmp/test_relay_pipeline

      # ── Suite 2b: payment-proto (133 tests) ─────────────────────
      # Covers the tollgate PAY/ACK header: packed layout, encode/decode
      # round-trips, truncation + bad msg_type rejection, buffer-too-small
      # (canary-checked, nothing written), and seq/price_sats boundaries.
      - name: Build & run tracker tollgate proto tests
        run: |
          cd tracker/firmware
          gcc -Wall -O2 -I main -I components/nostr_store/include \
            -o /tmp/test_tollgate_payment_proto \
            main/test/test_tollgate_payment_proto.c \
            main/tollgate_payment_proto.c
          /tmp/test_tollgate_payment_proto

      # ── Suite 2c: PAY→ACK harness log parser (17 tests, host-only) ─
      # Regression guard for the D6 false-negative/false-positive defects:
      # `seq=%u` parsing, TRACKER-tag/telemetry false positives, seq 0, the
      # whitespace-only `seq 9` form (t_24d9e30c), the sibling
      # `session_id 5` / `price 10 sats` / `expires 99` forms (t_2a65361e), and
      # the session NAME union `session=%u` / `session_id 5` (t_388122d0).
      - name: Run PAY→ACK harness parser regression tests
        run: |
          cd tracker/firmware
          python3 test/test_tollgate_payack_parse.py

      # ── Suite 3: tollgate (~350 tests across 13 binaries) ───────
      - name: Build & run tollgate unit tests
        run: |
          cd mesh-stack/tollgate/tests/unit
          make clean
          make
          make test

      # ── Suite 4: ehash-relay (65 tests) ─────────────────────────
      - name: Build & run ehash-relay tests
        run: |
          cd mesh-stack/ehash-relay
          gcc -std=c11 -Wall -I include/ -I ../protocol/ \
            test/test_ehash_relay.c \
            ehash_relay.c \
            ehash_crypto.c \
            ehash_messages.c \
            ehash_upstream.c \
            ehash_radio_stub.c \
            -o /tmp/test_relay
          /tmp/test_relay

      # ── Suite 5: stratorelay (11 tests) ─────────────────────────
      - name: Build & run stratorelay tests
        run: |
          g++ -std=c++17 -Wall \
            -I tracker/firmware/components/stratorelay \
            tracker/firmware/components/stratorelay/test/test_stratorelay.cpp \
            -o /tmp/test_stratorelay
          /tmp/test_stratorelay

      # ── Suite 6: ESP32-C3 <-> RP2040 UART telemetry protocol (115) ─
      # t_79ae3ee7: the wire protocol between the two MCUs — frame format,
      # CRC-16/CCITT-FALSE, payload round-trips, decoder re-synchronisation
      # after noise, corruption/truncation handling and the sanity validators.
      # Host-side only (no ESP-IDF / Pico-SDK headers), no boards needed.
      - name: Build & run UART telemetry protocol tests
        run: |
          cd tracker/firmware/components/uart_telemetry/test
          make clean
          make
          make test

      # ── Suite 7: FLRC BT0.5 cross-platform parity (12 tests) ────
      # P0.5 (t_dc858d9b): proves the RP2040 and ESP32 FLRC bench firmware
      # program the same pulse shape (BT0.5 => 0x25), which is what makes a
      # raw-FLRC ESP32<->RP2040 link possible at all. Host-side only: it
      # asserts the register bytes emitted, no boards needed.
      - name: Run FLRC BT0.5 parity tests
        run: |
          # PEP 668: the runner's python3 may be externally managed, which makes a
          # plain `pip install` exit 1 and takes the whole lane down (observed in the
          # ngit act container on d3a3b45a, 2026-09-29).  Prefer a normal install,
          # fall back to the documented override.
          python3 -m pip install --quiet pytest \
            || python3 -m pip install --quiet --break-system-packages pytest
          python3 -m pytest tests/test_flrc_bt05_parity.py -v --tb=short

      # ── Suite 10: v10 connectivity registry + routing gates (ADR-125/126) ─
      # The operator found a lane at 0.000mm over U_C.9, two dead-end stubs and 21.7mm of
      # copper through the F33's body. Each is now a test: the registry must match the
      # board, every unassigned pad must be justified in OPEN-ITEMS.md, and each gate is
      # exercised against a POISONED board carrying the defect (a gate that cannot fail is
      # not a gate). The pcbnew half loud-skips on a runner without KiCad.
      - name: Run v10 connectivity + routing gate tests
        run: |
          python3 -m pip install --quiet pytest \
            || python3 -m pip install --quiet --break-system-packages pytest
          python3 -m pytest tests/test_v10_connectivity.py -v --tb=short

      # ── Suite 11: ADR-126 routing method is mandatory ─────────────
      # Static assertions: the banned straight/L router is marked as such, the A* router
      # exists and carries the via + obstacle rules, and AGENTS.md binds both. These run
      # anywhere (no pcbnew needed).
      - name: Assert the routing method is the ADR-126 A* router
        run: |
          python3 -m pytest tests/test_routing_method_binding.py -v --tb=short

      # ── Suite 9: PCB Phase 1 track-import spec (t_877751ec) ──────
      # The import defect that cost 181 track_dangling violations: a hand-rolled
      # DSN parser with no Y inversion and no degenerate-segment collapse.  The
      # spec pins the coordinate transform against the board's own footprints,
      # the collapse threshold against the DSN's length histogram, and prefers
      # KiCad's ImportSpecctraSES over the DSN parser.  The DSN half runs
      # anywhere; the board-level half self-skips without pcbnew.
      - name: Run PCB track-import spec
        run: |
          python3 -m pip install --quiet pytest \
            || python3 -m pip install --quiet --break-system-packages pytest
          python3 -m pytest tests/test_pcb_track_import.py -v --tb=short

  # The four behavioural PCB pipeline gates need pcbnew. Installing KiCad in the
  # shared host-tests job would also un-skip the v10 board gates, which carry
  # pre-existing board/registry drift -- turning every PR red for an unrelated
  # baseline. So the pipeline suite gets its own job, isolated on purpose.
  #
  # UPDATED 2026-11-11: the drift above is FIXED (registry now DRIFT 0 against the board of
  # record), and this job also runs the v10 connectivity suite. That suite used to live in the
  # host-tests job, which installs no KiCad, so 8 of its 10 tests silently skipped there -- the
  # three real failures it was hiding had NEVER executed in CI. Running it here, with a
  # fail-closed assertion that the pcbnew tests did not skip, is what makes it a gate.
  pcb-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad python bindings
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          # The pipeline is written against KiCad 9 (see full_pipeline.py); an
          # image resolving an older pcbnew must fail here, loudly.
          /usr/bin/python3 -c "import pcbnew; v = pcbnew.Version(); print('pcbnew', v); assert v.startswith('9.'), v"

      - name: Run PCB pipeline gate tests
        run: |
          /usr/bin/python3 -m pip install --quiet pytest \
            || /usr/bin/python3 -m pip install --quiet --break-system-packages pytest
          /usr/bin/python3 -m pytest tests/test_pcb_pipeline_gates.py \
            tests/test_adr142_socket_edge_tracks.py -v --tb=short \
            --junitxml="$RUNNER_TEMP/pcb-pipeline.xml"

      # The v10 connectivity suite. Moved here 2026-11-11 because it needs pcbnew: in the
      # host-tests job 8 of its 10 tests skipped, so the 3 failures it had been carrying were
      # never executed anywhere. There is no built-in "skip is a failure" flag here, so the
      # step below asserts the real outcome from the JUnit XML instead of trusting the exit code.
      - name: Run v10 connectivity suite (needs pcbnew)
        run: |
          /usr/bin/python3 -m pytest tests/test_v10_connectivity.py -v --tb=short \
            --junitxml="$RUNNER_TEMP/v10-connectivity.xml"

      # FAIL CLOSED. Same reasoning as the board-check assertion below: a skip is a missing
      # check, not a pass. Requires 10 executed tests, 0 skipped, 0 failed -- so if the image
      # loses pcbnew this job goes red instead of quietly testing nothing.
      - name: Assert the v10 connectivity suite actually ran
        run: |
          /usr/bin/python3 - "$RUNNER_TEMP/v10-connectivity.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          suites = ET.parse(sys.argv[1]).getroot()
          cases = suites.iter('testcase')
          total = skipped = failed = 0
          for c in cases:
              total += 1
              if c.find('skipped') is not None:
                  skipped += 1
              if c.find('failure') is not None or c.find('error') is not None:
                  failed += 1
          print(f"v10 connectivity: {total} tests, {skipped} skipped, {failed} failed")
          problems = []
          if total != 10:
              problems.append(f"expected 10 tests, got {total}")
          if skipped:
              problems.append(f"{skipped} test(s) SKIPPED -- pcbnew missing, so nothing was checked")
          if failed:
              problems.append(f"{failed} test(s) failed")
          if problems:
              sys.exit("FAIL CLOSED: " + "; ".join(problems))
          print("OK: all 10 executed with pcbnew present")
          PY

      # FAIL CLOSED. The four behavioural checks used to skip silently when the
      # binding was missing, which is how four real failures hid behind a green
      # tick. A skip here is a missing check, not a pass.
      - name: Assert the four board checks actually ran
        run: |
          /usr/bin/python3 scripts/assert_board_checks_ran.py \
            "$RUNNER_TEMP/pcb-pipeline.xml"

      # No setup-python here: pcbnew is built for the distro interpreter.
      # Keep this blocking and unconditional, paired with test.yml's exclusion.
      - name: Run native wing export tests
        run: |
          /usr/bin/python3 -c "import pcbnew; v = pcbnew.Version(); print('pcbnew', v); assert v.startswith('9.'), v"
          /usr/bin/python3 -m pytest tests/test_wing_order_export.py -v --tb=short \
            --junitxml="$RUNNER_TEMP/wing-export.xml"
          /usr/bin/python3 scripts/assert_board_checks_ran.py \
            "$RUNNER_TEMP/wing-export.xml" \
            --require test_front_paste_has_six_diode_pads \
            --require test_native_origin_and_asymmetric_pad_anchor \
            --require test_each_reversed_diode_fails \
            --require test_native_bypass_polarity
